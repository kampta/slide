[workspace]
resolver = "2"
members = ["crates/slide-core", "crates/slide-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
slide-core = { path = "crates/slide-core" }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
portable-pty = "0.9"
dirs = "5"
rand = "0.8"
futures = "0.3"
bytes = "1"
async-trait = "0.1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

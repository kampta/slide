version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Disable routine version PRs. Repository security updates stay enabled.
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    # Disable routine version PRs. Repository security updates stay enabled.
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Action majors can change runner/runtime behavior. Keep them as
    # individual PRs so each pin is reviewed against its release notes.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Dependency and secret scans still catch newly disclosed issues weekly.
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Gitleaks needs `pull-requests: read` to list PR commits.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: fmt · web · clippy · test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        # rustup honors the exact version and components in
        # rust-toolchain.toml; this keeps CI aligned with local builds.
        run: rustup show active-toolchain

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Setup Node (for rust-embed web/dist)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Install web deps
        run: npm --prefix web ci

      - name: Build web assets
        run: npm --prefix web run build

      - name: Web regression tests
        run: npm --prefix web run test

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test workspace
        run: cargo test --locked --workspace

  security:
    # Runs in parallel with `ci`. Pure scans only — no Rust compile — so
    # this stays under a minute and doesn't stack on the main build.
    name: npm audit · cargo audit · secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 is only needed for gitleaks on push events so it can
      # diff the full history; PRs go through the API path.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: npm audit
        run: npm --prefix web audit --package-lock-only --audit-level=moderate

      # taiki-e/install-action fetches a prebuilt cargo-audit binary from
      # GitHub Releases. rustsec/audit-check compiles cargo-audit from
      # source, which was costing ~4min on a cold runner — no thanks.
      - name: Install cargo-audit
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
        with:
          tool: cargo-audit

      - name: cargo audit
        # Once warnings are intentionally cleared, keep unmaintained and
        # unsound advisories from silently passing as "allowed warnings".
        run: cargo audit --deny warnings

      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

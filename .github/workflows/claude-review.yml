name: Claude Review

# Disabled until the Claude Code GitHub App (https://github.com/apps/claude)
# is installed on this repo — the action's token exchange returns 401
# without it. To re-enable automatic PR reviews, restore:
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened]
on:
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      # claude-code-action authenticates to Anthropic via GitHub OIDC;
      # without id-token:write the action errors out before the prompt runs.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this PR against CLAUDE.md. Check:
            - correctness and whether the diff actually solves the stated problem
            - missing or insufficient test coverage for new logic
            - security: token handling, PTY escape sequences, SQL injection,
              daemon bind address, log leaks
            - scope: is the diff minimal, or does it include unrelated refactors
            - Rust idioms: unnecessary unwrap, clippy-worthy patterns
            - web: TypeScript strictness, xterm.js lifecycle

            Leave inline review comments. Approve if clean, request changes
            otherwise. Do not push commits from this workflow.
          claude_args: --max-turns 5
